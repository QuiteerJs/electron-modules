name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # 测试走替身, 不需要 electron 二进制
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # preload 的 index.d.cts 引用 dist 里的类型, 需先构建再做类型检查
      - run: pnpm build
      - run: pnpm check
      - run: pnpm test
